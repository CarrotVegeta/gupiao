<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>方案D Bento 仪表盘</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#EEF1F7;--surface:#fff;--border:#E2E7F0;--text:#0B1220;--muted:#64748B;--dim:#94A3B8;
    --rise:#E5484D;--fall:#16A34A;--a1:#5B5BD6;--a2:#0EA5E9;
    --mono:'JetBrains Mono','WenQuanYi Zen Hei Mono',ui-monospace,monospace}
  body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--text);
    font:400 13px/1.45 -apple-system,'Segoe UI','WenQuanYi Zen Hei',sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .rise{color:var(--rise)}.fall{color:var(--fall)}.muted{color:var(--muted)}.dim{color:var(--dim)}
  header{height:60px;display:flex;align-items:center;gap:18px;padding:0 26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px}
  .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#5B5BD6,#8B8BFF);color:#fff;
    display:grid;place-items:center;font-size:14px;font-weight:700}
  nav{display:flex;gap:3px}
  nav a{padding:7px 14px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:550}
  nav a.on{background:#0B1220;color:#fff}
  .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{height:34px;padding:0 15px;border-radius:9px;border:1px solid var(--border);background:#fff;font:550 12.5px inherit;color:var(--text)}
  .btn.pri{background:var(--a1);border-color:var(--a1);color:#fff}
  .tick{font-size:12px;color:var(--muted);font-family:var(--mono)}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:126px 126px 1fr;
    gap:14px;padding:0 26px 22px;height:calc(900px - 60px)}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;
    display:flex;flex-direction:column;overflow:hidden;position:relative}
  .tile h3{font-size:11.5px;font-weight:600;color:var(--dim);letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .tile .big{font-size:34px;font-weight:750;letter-spacing:-1px;line-height:1}
  .tile .sub{font-size:12.5px;font-weight:600;margin-top:8px;display:flex;gap:12px}
  .tile svg.spark{position:absolute;right:16px;top:18px;width:120px;height:44px}
  .kpi{display:flex;gap:22px;align-items:flex-end;height:100%}
  .kpi div{display:flex;flex-direction:column;gap:4px}
  .kpi .v{font-size:24px;font-weight:730;font-family:var(--mono);letter-spacing:-.7px;line-height:1}
  .kpi .k{font-size:11px;color:var(--dim)}
  .tile.dark{background:#0B1220;border-color:#0B1220;color:#F8FAFC}
  .tile.dark h3{color:#7C8AA8}
  .tile.grad{background:linear-gradient(135deg,#5B5BD6,#7C6BFF);border-color:transparent;color:#fff}
  .tile.grad h3{color:rgba(255,255,255,.72)}
  .rows{flex:1;display:flex;flex-direction:column;gap:0;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1F4F9;font-size:12.5px}
  .row:last-child{border-bottom:0}
  .row .l{display:flex;align-items:center;gap:8px}
  .row .nm{font-weight:600}
  .row .cd{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .row .v{font-family:var(--mono);font-weight:650}
  .bar{height:7px;border-radius:4px;background:#F1F4F9;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--a1)}
  .dist{display:flex;align-items:flex-end;gap:3px;height:58px;margin-top:auto}
  .dist i{flex:1;border-radius:3px 3px 0 0;background:#DDE3EE}
  .dist i.up{background:var(--rise)} .dist i.dn{background:var(--fall)}
  .pill{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600}
  .pill.r{background:#FDECEC;color:var(--rise)} .pill.g{background:#E9F7EF;color:var(--fall)}
  .pill.b{background:#EEF0FF;color:var(--a1)}
</style></head><body>

<header>
  <div class="brand"><span class="mark">A</span>今日看板</div>
  <nav><a href="#" class="on">总览</a><a href="#">自选</a><a href="#">持仓</a><a href="#">涨停</a><a href="#">竞价</a><a href="#">龙虎榜</a></nav>
  <div class="sp"><span class="tick">09-17 15:00 收盘</span>
    <button class="btn">刷新</button><button class="btn pri">+ 添加股票</button></div>
</header>

<div class="grid">
  <!-- 指数大卡 -->
  <div class="tile" style="grid-column:span 4;grid-row:span 1">
    <h3>上证指数</h3>
    <div class="big num">3873.07</div>
    <div class="sub num"><span class="fall">-18.53</span><span class="fall">-0.48%</span><span class="dim">1.02万亿</span></div>
    <svg class="spark" viewBox="0 0 120 44" preserveAspectRatio="none"><path d="M0 12 L15 18 L30 11 L45 20 L60 16 L75 25 L90 21 L105 30 L120 26" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="tile" style="grid-column:span 4">
    <h3>深证成指</h3>
    <div class="big num">12864.31</div>
    <div class="sub num"><span class="rise">+42.11</span><span class="rise">+0.33%</span><span class="dim">1.34万亿</span></div>
    <svg class="spark" viewBox="0 0 120 44" preserveAspectRatio="none"><path d="M0 34 L15 26 L30 30 L45 18 L60 22 L75 12 L90 16 L105 7 L120 10" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="tile" style="grid-column:span 4">
    <h3>创业板指</h3>
    <div class="big num">2712.88</div>
    <div class="sub num"><span class="rise">+9.06</span><span class="rise">+0.34%</span><span class="dim">5842亿</span></div>
    <svg class="spark" viewBox="0 0 120 44" preserveAspectRatio="none"><path d="M0 28 L15 32 L30 20 L45 26 L60 14 L75 18 L90 9 L105 13 L120 6" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/></svg>
  </div>

  <!-- 持仓 KPI -->
  <div class="tile grad" style="grid-column:span 5">
    <h3>我的持仓</h3>
    <div class="kpi">
      <div><span class="v">+3,182</span><span class="k">今日盈亏</span></div>
      <div><span class="v">+2.41%</span><span class="k">今日收益率</span></div>
      <div><span class="v">13.6万</span><span class="k">总市值</span></div>
    </div>
  </div>
  <!-- 市场情绪 -->
  <div class="tile" style="grid-column:span 3">
    <h3>市场情绪</h3>
    <div class="kpi" style="gap:16px">
      <div><span class="v rise">94</span><span class="k">涨停</span></div>
      <div><span class="v">25</span><span class="k">炸板</span></div>
      <div><span class="v">4.5%</span><span class="k">晋级率</span></div>
    </div>
    <div class="bar" style="margin-top:14px"><i style="width:79%;background:var(--rise)"></i></div>
    <div class="dim" style="font-size:11px;margin-top:6px">炸板率 21% · 情绪偏暖</div>
  </div>
  <!-- 涨跌分布 -->
  <div class="tile" style="grid-column:span 4">
    <h3>涨跌分布 <span class="num" style="margin-left:auto;color:var(--dim);font-weight:500">2318 涨 / 2574 跌</span></h3>
    <div class="dist" id="dist" style="height:58px"></div>
  </div>

  <!-- 自选 -->
  <div class="tile" style="grid-column:span 5">
    <h3>我的票 <span class="pill b">13</span><span style="margin-left:auto;font-weight:500;color:var(--dim)">按涨跌幅</span></h3>
    <div class="rows" id="wl"></div>
  </div>
  <!-- 竞价候选 -->
  <div class="tile" style="grid-column:span 4">
    <h3>竞价候选 TOP <span class="pill r">合格 3</span></h3>
    <div class="rows" id="auc"></div>
  </div>
  <!-- 连板梯队 -->
  <div class="tile" style="grid-column:span 3">
    <h3>连板梯队</h3>
    <div class="rows" id="ladder"></div>
  </div>
</div>

<script>
const wl=[['农发种业','600313','7.11','+5.18%'],['金健米业','600127','13.02','+9.97%'],['澳弘电子','605058','48.76','+9.99%'],
['华瓷股份','001216','19.88','+10.02%'],['中晶科技','003026','26.41','+9.99%'],['登海种业','002041','10.36','+5.50%'],
['贵州茅台','600519','1266.66','+0.69%'],['金螳螂','002081','4.79','-1.44%'],['深桑达Ａ','000032','14.39','-1.71%'],
['平安银行','000001','11.62','-0.68%']];
document.getElementById('wl').innerHTML=wl.map(r=>{const up=r[3][0]==='+';
 return `<div class="row"><div class="l"><div><div class="nm">${r[0]}</div><div class="cd">${r[1]}</div></div></div>
 <div style="text-align:right"><div class="v ${up?'rise':'fall'}">${r[2]}</div><div class="v ${up?'rise':'fall'}" style="font-size:11.5px">${r[3]}</div></div></div>`}).join('');
const lad=[['4 板','澳弘电子','封单 1.2亿','+9.99%'],['3 板','中晶科技','封单 8600万','+9.99%'],['2 板','华瓷股份','封单 5400万','+10.02%'],
['2 板','世联行','封单 3100万','+10.04%'],['1 板','内蒙新华','封单 3100万','+9.96%'],['1 板','农发种业','封单 2600万','+5.18%']];
document.getElementById('ladder').innerHTML=lad.map(r=>`<div class="row"><div class="l"><span class="pill r">${r[0]}</span>
 <div><div class="nm">${r[1]}</div><div class="cd">${r[2]}</div></div></div><div class="v rise">${r[3]}</div></div>`).join('');
const auc=[['华瓷股份','2板',67],['中晶科技','2板',62],['内蒙新华','1板',59],['澳弘电子','4板',51],['西陇科学','2板',46],['世联行','1板',37],['洪兴股份','1板',33]];
document.getElementById('auc').innerHTML=auc.map(r=>`<div class="row"><div class="l"><div><div class="nm">${r[0]} <span class="cd">${r[1]}</span></div>
 <div class="bar" style="width:110px"><i style="width:${r[2]}%"></i></div></div></div><div class="v">${r[2]}%</div></div>`).join('');
const lhb=[['华瓷股份','+1.84亿','机构专用'],['中晶科技','+1.12亿','深股通'],['内蒙新华','+6,420万','游资']];
document.getElementById('lhb').innerHTML=lhb.map(r=>`<div class="row"><div><div class="nm">${r[0]}</div><div class="cd">${r[2]}</div></div>
 <div class="v rise">${r[1]}</div></div>`).join('');
document.getElementById('dist').innerHTML=Array.from({length:28},(_,i)=>{
 const h=14+Math.abs(Math.sin(i*1.7))*38; const up=i%3!==0;
 return `<i class="${up?'up':'dn'}" style="height:${h}px"></i>`}).join('');
</script>
</body></html>
